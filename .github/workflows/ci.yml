name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Pin the deterministic offline embedder so the suite never downloads a model in CI.
      RAGSEC_EMBEDDER: hashing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  paper:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      RAGSEC_EMBEDDER: hashing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,paper]"

      # Rebuilds every table and figure from the committed result records and cross-checks
      # them against the manuscript: an undefined reference, a missing figure, or a result
      # macro the text quotes but no study produced will fail the build.
      - name: Rebuild tables and figures
        run: ragsec figures --strict

      - name: Assemble the submission file
        run: ragsec manuscript

      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            paper/figures/
            paper/tables/
            paper/generated/template.tex
          retention-days: 14
